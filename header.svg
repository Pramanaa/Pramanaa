  <text x="60" y="146" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="700" letter-spacing="-2" fill="#FFF1F2">Pramana Putra<tspan fill="#FF5C6C">.</tspan></text>
  <text x="63" y="193" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#D9A6AE">Building useful things for the web.</text>
  <text x="63" y="267" font-family="monospace" font-size="15" letter-spacing="1" fill="#FF5C6C">LARAVEL <tspan fill="#87434F"> / </tspan>NEXT.JS <tspan fill="#87434F"> / </tspan>CONTAINERS</text>
  <rect x="800" y="64" width="334" height="191" rx="14" fill="#130407" stroke="#662231"/>
  <path d="M800 102H1134" stroke="#48121D"/>
  <circle cx="822" cy="83" r="4" fill="#FF5C6C"/><circle cx="838" cy="83" r="4" fill="#CC3044"/><circle cx="854" cy="83" r="4" fill="#7E1D2D"/>
  <text x="1099" y="87" text-anchor="end" font-family="monospace" font-size="11" fill="#B97986">~/pramanaa</text>
  <text x="824" y="139" font-family="monospace" font-size="15" fill="#FF5C6C">$ build something useful</text>
  <text x="824" y="170" font-family="monospace" font-size="14" fill="#D9A6AE">ideas → interfaces → apps</text>
