  <rect x="966" y="211" width="9" height="17" rx="1" fill="#FF9AA5"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.45;0.5;1" dur="1.2s" repeatCount="indefinite"/></rect>
