<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Pramana Putra</title>
  <desc id="desc">Building useful things for the web. A dark crimson banner with red and rose accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse"><stop stop-color="#190508"/><stop offset="1" stop-color="#30090F"/></linearGradient>
    <linearGradient id="accent" x1="60" y1="0" x2="1100" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#FF5C6C"/><stop offset="1" stop-color="#FF9AA5"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#D98A93" stroke-opacity=".06"/></pattern>
  </defs>
  <rect x="1" y="1" width="1198" height="318" rx="22" fill="url(#bg)" stroke="#5E1B28"/>
  <rect x="1" y="1" width="1198" height="318" rx="22" fill="url(#grid)"/>
  <path d="M60 58H118" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
